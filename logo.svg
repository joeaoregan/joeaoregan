<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 106" width="100%" height="100%">
  <defs>
    <style>
      .bg {
        fill: #020d06;
        stroke: #1b5e20;
        stroke-width: 2;
        rx: 8px;
      }

      .term-text {
        font-family: 'Consolas', monospace;
        font-size: 24px;
        font-weight: 700;
        fill: #5af78e;
        letter-spacing: 0px;
      }

      /* Consolas metrics at 24px: 13.2px advance per character */
      /* Line 1: 11 chars * 13.2px = 145.2px */
      /* Line 2: 17 chars * 13.2px = 224.4px */

      /* Line 1 (Joe O'Regan):
         - Types: 0% to 22%
         - Holds: 22% to 88%
         - Clears second: 90%
      */
      @keyframes typeLine1 {
        0%          { width: 0; }
        22%, 88%    { width: 147px; }
        90%, 100%   { width: 0; }
      }

      /* Line 2 (Software Engineer):
         - Idle: 0% to 34%
         - Types: 34% to 68%
         - Holds: 68% to 78%
         - Clears first: 80%
      */
      @keyframes typeLine2 {
        0%, 34%     { width: 0; }
        68%, 78%    { width: 226px; }
        80%, 100%   { width: 0; }
      }

      /* Vertical line spacing adjusted to 38px down for line 2 */
      @keyframes moveCursor {
        /* Line 1: Joe O'Regan (11 chars) */
        0%, 1.99%   { transform: translate(0px, 0px); opacity: 1; }
        2%, 3.99%   { transform: translate(13.2px, 0px); opacity: 1; }
        4%, 5.99%   { transform: translate(26.4px, 0px); opacity: 1; }
        6%, 7.99%   { transform: translate(39.6px, 0px); opacity: 1; }
        8%, 9.99%   { transform: translate(52.8px, 0px); opacity: 1; }
        10%, 11.99% { transform: translate(66.0px, 0px); opacity: 1; }
        12%, 13.99% { transform: translate(79.2px, 0px); opacity: 1; }
        14%, 15.99% { transform: translate(92.4px, 0px); opacity: 1; }
        16%, 17.99% { transform: translate(105.6px, 0px); opacity: 1; }
        18%, 19.99% { transform: translate(118.8px, 0px); opacity: 1; }
        20%, 21.99% { transform: translate(132.0px, 0px); opacity: 1; }
        22%, 30.99% { transform: translate(145.2px, 0px); opacity: 1; }

        /* Jump down to start of Line 2 */
        31%, 33.99% { transform: translate(0px, 38px); opacity: 1; }

        /* Line 2: Software Engineer (17 chars) */
        34%, 35.99% { transform: translate(0px, 38px); opacity: 1; }
        36%, 37.99% { transform: translate(13.2px, 38px); opacity: 1; }
        38%, 39.99% { transform: translate(26.4px, 38px); opacity: 1; }
        40%, 41.99% { transform: translate(39.6px, 38px); opacity: 1; }
        42%, 43.99% { transform: translate(52.8px, 38px); opacity: 1; }
        44%, 45.99% { transform: translate(66.0px, 38px); opacity: 1; }
        46%, 47.99% { transform: translate(79.2px, 38px); opacity: 1; }
        48%, 49.99% { transform: translate(92.4px, 38px); opacity: 1; }
        50%, 51.99% { transform: translate(105.6px, 38px); opacity: 1; }
        52%, 53.99% { transform: translate(118.8px, 38px); opacity: 1; }
        54%, 55.99% { transform: translate(132.0px, 38px); opacity: 1; }
        56%, 57.99% { transform: translate(145.2px, 38px); opacity: 1; }
        58%, 59.99% { transform: translate(158.4px, 38px); opacity: 1; }
        60%, 61.99% { transform: translate(171.6px, 38px); opacity: 1; }
        62%, 63.99% { transform: translate(184.8px, 38px); opacity: 1; }
        64%, 65.99% { transform: translate(198.0px, 38px); opacity: 1; }
        66%, 67.99% { transform: translate(211.2px, 38px); opacity: 1; }
        68%, 78%    { transform: translate(224.4px, 38px); opacity: 1; }

        /* Cursor hides while lines clear */
        78.1%, 99.9% { transform: translate(0px, 0px); opacity: 0; }
        100%        { transform: translate(0px, 0px); opacity: 1; }
      }

      @keyframes blinkCursor {
        0%, 49.9% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      .clip-box-1 {
        animation: typeLine1 9s steps(11, end) infinite;
      }

      .clip-box-2 {
        animation: typeLine2 9s steps(17, end) infinite;
      }

      .cursor-tracker {
        animation: moveCursor 9s linear infinite;
      }

      .cursor-shape {
        animation: blinkCursor 0.55s step-end infinite;
      }
    </style>

    <clipPath id="clipLine1">
      <rect class="clip-box-1" x="30" y="16" width="0" height="34" />
    </clipPath>

    <clipPath id="clipLine2">
      <rect class="clip-box-2" x="30" y="54" width="0" height="34" />
    </clipPath>
  </defs>

  <!-- Compact Background: 106px tall instead of 160px -->
  <rect class="bg" x="2" y="2" width="516" height="102" />

  <!-- Line 1 -->
  <g clip-path="url(#clipLine1)">
    <text class="term-text" x="30" y="42" textLength="145.2" lengthAdjust="spacingAndGlyphs">Joe O'Regan</text>
  </g>

  <!-- Line 2 -->
  <g clip-path="url(#clipLine2)">
    <text class="term-text" x="30" y="80" textLength="224.4" lengthAdjust="spacingAndGlyphs">Software Engineer</text>
  </g>

  <!-- Single Tracking Cursor -->
  <g class="cursor-tracker">
    <rect class="cursor-shape" x="30" y="22" width="12" height="23" fill="#5af78e" />
  </g>
</svg>
